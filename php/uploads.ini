; Raises upload limits for the coffee-shop-core media endpoint (Hall of Fame video uploads
; need up to 50MB; the PHP_UPLOAD_MAX_FILESIZE/PHP_POST_MAX_SIZE env vars are NOT recognized
; by the official wordpress:apache image, so this must be a real php.ini file instead.
upload_max_filesize = 60M
post_max_size = 64M

; Suppress PHP 8.x deprecation warnings and undefined array key notices
error_reporting = E_ERROR | E_WARNING | E_PARSE | E_CORE_ERROR | E_CORE_WARNING | E_COMPILE_ERROR | E_COMPILE_WARNING | E_RECOVERABLE_ERROR
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php_errors.log
